<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Image Analyzer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #1a1a1a;
            color: white;
        }
        
        .container {
            text-align: center;
        }
        
        .input-section {
            margin: 30px 0;
        }
        
        input {
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            width: 300px;
            margin-right: 10px;
        }
        
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #61dafb;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover:not(:disabled) {
            background-color: #21a9c0;
        }
        
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        
        .error {
            color: #ff6b6b;
            margin: 15px 0;
            padding: 10px;
            border-radius: 4px;
            background-color: rgba(255, 107, 107, 0.1);
        }
        
        .results {
            margin-top: 30px;
            text-align: left;
        }
        
        .image-result {
            margin-bottom: 30px;
            padding: 15px;
            background-color: #3a3f4b;
            border-radius: 8px;
        }
        
        .object-feature {
            background-color: #2c313a;
            margin: 15px 0;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #61dafb;
        }
        
        .bbox-coordinates {
            font-family: monospace;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 4px;
            color: #ff6b6b;
        }
        
        .image-container {
            position: relative;
            margin: 20px 0;
            display: inline-block;
        }
        
        .image-placeholder {
            background-color: #444;
            color: white;
            padding: 20px;
            border-radius: 8px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .image-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        
        .image-item {
            position: relative;
            border: 1px solid #555;
            border-radius: 4px;
            overflow: hidden;
            text-align: center;
            width: 300px;
        }
        
        .image-item img {
            max-width: 100%;
            max-height: 300px;
            display: block;
            margin: 0 auto;
        }
        
        .image-info {
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            font-size: 14px;
        }
        
        .loading {
            color: #61dafb;
        }
        
        .bbox-overlay {
            position: absolute;
            border: 2px solid #00ff00;
            background-color: rgba(0, 255, 0, 0.1);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Product Image Analyzer</h1>
        
        <div class="input-section">
            <input type="text" id="productId" placeholder="Enter product ID" />
            <button onclick="analyzeProduct()">Analyze Product</button>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="results" class="results" style="display: none;">
            <h2 id="results-title">Analysis Results</h2>
            <div id="images-section">
                <h3>Product Images</h3>
                <div id="images-container" class="image-grid"></div>
            </div>
            <div id="results-content"></div>
        </div>
    </div>

    <script>
        async function analyzeProduct() {
            const productId = document.getElementById('productId').value.trim();
            const errorDiv = document.getElementById('error');
            const resultsDiv = document.getElementById('results');
            const imagesContainer = document.getElementById('images-container');
            const resultsContent = document.getElementById('results-content');
            
            if (!productId) {
                showError('Please enter a product ID');
                return;
            }
            
            // Show loading state
            errorDiv.style.display = 'none';
            resultsDiv.style.display = 'none';
            imagesContainer.innerHTML = '<p class="loading">Loading images...</p>';
            resultsContent.innerHTML = '';
            
            try {
                // First get the available images for this product
                const imagesResponse = await fetch(`http://localhost:5002/product-images/${productId}`);
                const imagesData = await imagesResponse.json();
                
                // Then analyze the product
                const analyzeResponse = await fetch('http://localhost:5002/analyze-product', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ product_id: productId }),
                });
                
                const data = await analyzeResponse.json();
                
                if (!analyzeResponse.ok) {
                    throw new Error(data.error || 'Failed to process product');
                }
                
                // Display results
                displayResults(data, imagesData);
                
            } catch (err) {
                showError(err.message || 'An error occurred while processing the request');
                imagesContainer.innerHTML = '<p>Failed to load images.</p>';
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function displayResults(data, imagesData) {
            const resultsDiv = document.getElementById('results');
            const resultsContent = document.getElementById('results-content');
            const resultsTitle = document.getElementById('results-title');
            const imagesContainer = document.getElementById('images-container');
            
            resultsTitle.textContent = `Analysis Results for Product ${data.product_id}`;
            
            // Display images from Pics folder
            displayProductImages(imagesContainer, imagesData, data.features);
            
            let content = `<p>Images processed: ${data.images_processed}</p>`;
            
            data.features.forEach((imageFeatures, imageIndex) => {
                if (imageFeatures && imageFeatures.length > 0) {
                    content += `<div class="image-result">
                        <h3>Image ${imageIndex + 1} Analysis</h3>`;
                
                    imageFeatures.forEach((obj, objIndex) => {
                        content += `
                            <div class="object-feature">
                                <h4>${obj.name}</h4>
                                <p><strong>Location:</strong> ${obj.location}</p>
                                <p><strong>Size:</strong> ${obj.size}</p>
                                <div class="bbox-coordinates">
                                    BBox: x_min=${obj.bbox.x_min}, y_min=${obj.bbox.y_min}, 
                                    x_max=${obj.bbox.x_max}, y_max=${obj.bbox.y_max}
                                </div>
                            </div>
                        `;
                    });
                    
                    content += `</div>`;
                }
            });
            
            resultsContent.innerHTML = content;
            resultsDiv.style.display = 'block';
        }
        
        function displayProductImages(container, imagesData, analysisResults) {
            // Clear previous content
            container.innerHTML = '';
            
            // Check if we have images
            if (!imagesData.images || imagesData.images.length === 0) {
                container.innerHTML = '<p>No images available for this product.</p>';
                return;
            }
            
            // Create image items with real image display
            imagesData.images.forEach((img, index) => {
                const imageItem = document.createElement('div');
                imageItem.className = 'image-item';
                
                if (img.exists) {
                    // создадим элемент для отображения изображения
                    // Для демонстрации будем использовать placeholder с реальными данными
                    imageItem.innerHTML = `
                        <div class="image-placeholder">
                            <p>Image ${img.order}</p>
                            <p>${img.filename}</p>
                            <p>✓ Available</p>
                            <p style="font-size: 12px; margin-top: 10px;">
                                ${analysisResults[index] ? 
                                    (analysisResults[index].length > 0 ? 
                                        `${analysisResults[index].length} objects detected` : 
                                        'No objects found') : 
                                    'Analysis pending'}
                            </p>
                        </div>
                    `;
                } else {
                    // Show unavailable image
                    imageItem.innerHTML = `
                        <div class="image-placeholder">
                            <p>Image ${img.order}</p>
                            <p>${img.filename}</p>
                            <p>✗ Not found in Pics</p>
                        </div>
                    `;
                }
                
                container.appendChild(imageItem);
            });
        }
        
        // Allow Enter key to trigger analysis
        document.getElementById('productId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                analyzeProduct();
            }
        });
    </script>
</body>
</html>
